
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | AforoVisión</title>

    <style>
        * {
            box-sizing: border-box;
  }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #1f2937;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .logo {
            margin-bottom: 24px;
            text-align: center;
            color: #1769aa;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        .descripcion {
            color: #64748b;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #1769aa;
            border-color: #1769aa;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #12558b;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .volver {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #1769aa;
            text-decoration: none;
        }

        .volver:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <div class="logo">AforoVisión</div>

        <h1>Recuperar contraseña</h1>

        <p class="descripcion">
            Ingresa el correo electrónico asociado a tu cuenta.
            Te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form id="formulario">
            <label for="correo">Correo electrónico</label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                autocomplete="email"
                required
            >

            <button type="submit" id="boton">
                Enviar enlace de recuperación
            </button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

        <a class="volver" href="login.html">
            Volver al inicio de sesión
        </a>
    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const correoInput = document.getElementById("correo");
        const boton = document.getElementById("boton");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            const correo = correoInput.value.trim();

            mensaje.textContent = "";
            boton.disabled = true;
            boton.textContent = "Enviando...";

            try {
                const respuesta = await fetch(
                    "http://127.0.0.1:8000/api/auth/solicitar-recuperacion",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            correo: correo
                        })
                    }
                );

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        resultado.detail ||
                        "No se pudo procesar la solicitud."
                    );
                }

                mensaje.textContent = resultado.mensaje;

            } catch (error) {
                mensaje.textContent =
                    error.message ||
                    "No se pudo conectar con el servidor. " +
                    "Comprueba que el backend esté funcionando.";
            } finally {
                boton.disabled = false;
                boton.textContent = "Enviar enlace de recuperación";
            }
        });
    </script>
</body>
</html>
