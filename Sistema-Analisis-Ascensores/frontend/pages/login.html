
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | AforoVisión</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <header class="login-header">
                <div class="logo">
                    <svg viewBox="0 0 64 64" role="img"
                         aria-label="Logo de AforoVisión">
                        <rect x="5" y="5" width="54" height="54" rx="12"
                              fill="#263d55"/>
                        <path d="M20 48 V17 H44 V48 M20 28 H44 M20 38 H44"
                              fill="none" stroke="#ffffff"
                              stroke-width="3.5" stroke-linecap="round"/>
                        <circle cx="32" cy="22" r="3" fill="#8cc8ff"/>
                        <circle cx="32" cy="33" r="3" fill="#8cc8ff"/>
                        <circle cx="32" cy="43" r="3" fill="#8cc8ff"/>
                    </svg>
                </div>

                <h1>AforoVisión</h1>
                <p class="subtitle">
                    Sistema de análisis y detección de sobrecarga en ascensores
                </p>
                <p class="subtitle">
                    Plataforma de administración • Acceso restringido
                </p>
            </header>

            <div class="login-content">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <p id="mensaje" role="alert" aria-live="polite"></p>

                    <button type="submit" id="btnLogin">
                        Iniciar sesión
                    </button>

                    <p class="enlace-recuperacion">
                        <a href="recuperar-contrasena.html">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </p>

                    <p class="enlace-registro">
                        ¿No tienes una cuenta?
                        <a href="registro.html">Registrarse</a>
                    </p>
                </form>
            </div>

            <footer class="login-footer">
                Solo administradores del sistema tienen acceso a esta plataforma.
            </footer>

        </section>
    </main>

    <script>
        const formulario = document.getElementById("loginForm");
        const campoUsuario = document.getElementById("usuario");
        const campoContrasena = document.getElementById("contrasena");
        const mensaje = document.getElementById("mensaje");
        const boton = document.getElementById("btnLogin");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const usuario = campoUsuario.value.trim();
            const contrasena = campoContrasena.value;

            if (!usuario || !contrasena) {
                mensaje.textContent =
                    "Por favor, ingrese su usuario y contraseña.";
                return;
            }

            mensaje.textContent = "";
            boton.disabled = true;
            boton.textContent = "Ingresando...";

            try {
                const respuesta = await fetch(
                    "http://127.0.0.1:8000/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            usuario: usuario,
                            contrasena: contrasena
                        })
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    if (respuesta.status === 401) {
                        mensaje.textContent =
                            "Error de acceso: usuario o contraseña incorrectos.";
                    } else {
                        mensaje.textContent =
                            datos.detail || "No fue posible iniciar sesión.";
                    }
                    return;
                }

                sessionStorage.setItem(
                    "aforovision_token",
                    datos.access_token
                );

                sessionStorage.setItem(
                    "aforovision_usuario",
                    JSON.stringify(datos.usuario)
                );

                // Redirigir al contenedor principal del sistema.
                window.location.href = "panel.html";

            } catch (error) {
                mensaje.textContent =
                    "No se pudo conectar con el servidor. Verifique que el backend esté funcionando.";
            } finally {
                boton.disabled = false;
                boton.textContent = "Iniciar sesión";
            }
        });
    </script>

</body>
</html>
